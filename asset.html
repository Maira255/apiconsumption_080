<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Master Asset - Peminjaman Asset</title>
    <link href="vendor/fontawesome-free/css/all.min.css" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,300,400,600,700,800,900" rel="stylesheet">
    <link href="css/sb-admin-2.min.css" rel="stylesheet">
</head>

<body id="page-top">
    <div id="wrapper">
        <ul class="navbar-nav bg-gradient-primary sidebar sidebar-dark accordion" id="accordionSidebar"></ul>

        <div id="content-wrapper" class="d-flex flex-column">
            <div id="content">
                <nav class="navbar navbar-expand navbar-light bg-white topbar mb-4 static-top shadow" id="topbar"></nav>

                <div class="container-fluid">
                    <div class="d-sm-flex align-items-center justify-content-between mb-4">
                        <h1 class="h3 mb-0 text-gray-800">Master Asset</h1>
                        <button class="btn btn-primary btn-sm shadow-sm" id="btnAdd"><i class="fas fa-plus fa-sm text-white-50"></i> Tambah Asset</button>
                    </div>
                                    <div class="card shadow mb-4">
                        <div class="card-body p-0">
                            <div class="table-responsive">
                                <table class="table table-modern table-striped table-hover" id="dataTable" width="100%" cellspacing="0">
                                    <thead>
                                        <tr style="text-align: center">
                                            <th>ID</th>
                                            <th>Nama Asset</th>
                                            <th>Kategori</th>
                                            <th>Jumlah</th>
                                            <th>Kondisi</th>
                                            <th>Lokasi</th>
                                            <th>Status</th>
                                            <th>Aksi</th>
                                        </tr>
                                    </thead>
                                    <tbody></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <footer class="sticky-footer bg-white">
                <div class="container my-auto">
                    <div class="copyright text-center my-auto"><span>Peminjaman Asset</span></div>
                </div>
            </footer>
        </div>
    </div>

    <a class="scroll-to-top rounded" href="#page-top"><i class="fas fa-angle-up"></i></a>

    <div class="modal fade" id="formModal" tabindex="-1" role="dialog">
        <div class="modal-dialog" role="document">
            <form class="modal-content" id="formModalForm">
                <div class="modal-header">
                    <h5 class="modal-title" id="formModalTitle">Tambah Asset</h5>
                    <button class="close" type="button" data-dismiss="modal"><span>&times;</span></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="recordId">
                    <div class="form-group"><label for="nama_asset">Nama Asset</label><input type="text" class="form-control" id="nama_asset" required></div>
                    <div class="form-group"><label for="kategori">Kategori</label><input type="text" class="form-control" id="kategori" required></div>
                    <div class="form-group"><label for="jumlah">Jumlah</label><input type="number" min="0" class="form-control" id="jumlah" required></div>
                    <div class="form-group"><label for="kondisi">Kondisi</label>
                        <select class="form-control" id="kondisi" required>
                            <option>Baik</option><option>Rusak Ringan</option><option>Rusak Berat</option>
                        </select></div>
                    <div class="form-group"><label for="lokasi">Lokasi</label><input type="text" class="form-control" id="lokasi" required></div>
                    <div class="form-group"><label for="status">Status</label>
                        <select class="form-control" id="status" required>
                            <option>Tersedia</option><option>Dipinjam</option>
                        </select></div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" type="button" data-dismiss="modal">Batal</button>
                    <button class="btn btn-primary" type="submit">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <script src="vendor/jquery/jquery.min.js"></script>
    <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="vendor/jquery-easing/jquery.easing.min.js"></script>
    <script src="js/sb-admin-2.min.js"></script>
    <script src="js/app.js"></script>
    <script>renderLayout('asset');</script>
    <script src="js/pages/asset.js"></script>
</body>

</html>
